<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egret X – Nur-Lesen-Diagnose</title><style>body{font:16px system-ui;background:#111827;color:#f9fafb;margin:0;padding:22px}button{background:#38bdf8;color:#082f49;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#030712;padding:14px;border-radius:10px;font:12px ui-monospace,monospace}p{line-height:1.5}.sub{color:#cbd5e1}</style></head><body><h2>Egret X – Bluetooth-Diagnose</h2><p class="sub">Testversion 1 · ausschließlich lesen und Benachrichtigungen abonnieren. Keine Schreibbefehle an den Scooter.</p><button id="connect">Scooter verbinden & prüfen</button> <button id="copy">Protokoll kopieren</button><p id="status">Nicht verbunden</p><pre id="log">Bereit.</pre><script>
'use strict';const OP='7d971cd0-8ebd-4684-b771-b2362b7e922a',SET='bccae7e0-458d-4554-8d8a-ddadd926efe3',BAT='f4b68c10-9e9e-4b97-a9c9-272e32453252',DIA='2b419d90-adef-4ca3-8652-c02093b6c84e',ID='70d1b670-eba5-4d76-868f-6d1b66108fdc';const uuids=[OP,SET,BAT,DIA,ID];let lines=[],dev;const out=document.querySelector('#log'),status=document.querySelector('#status');function log(s){lines.push(new Date().toLocaleTimeString('de-DE')+' '+s);out.textContent=lines.join('\n');}function err(e){return e?.name+': '+(e?.message||String(e));}function hex(v){return Array.from(new Uint8Array(v.buffer,v.byteOffset,v.byteLength),x=>x.toString(16).padStart(2,'0')).join(' ')}function short(s){return s.slice(0,8).toUpperCase()}async function test(){document.querySelector('#connect').disabled=true;lines=[];log('Test v1 / Browser '+navigator.userAgent);try{if(!navigator.bluetooth)throw Error('Web Bluetooth nicht verfügbar. In Bluefy öffnen.');dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EGRET'},{namePrefix:'Egret'},{services:[ID]},{services:[OP]}],optionalServices:uuids});log('Gerät ausgewählt (Name aus Datenschutzgründen nicht protokolliert)');dev.addEventListener('gattserverdisconnected',()=>{log('Bluetooth getrennt');status.textContent='Getrennt'});const server=await dev.gatt.connect();status.textContent='Verbunden';log('GATT verbunden');let services;try{services=await server.getPrimaryServices();log('Services gefunden: '+services.length)}catch(e){log('getPrimaryServices FEHLER '+err(e));throw e}const chars={};for(const s of services){log('Service '+short(s.uuid));try{const cs=await s.getCharacteristics();log('  Characteristics: '+cs.length);for(const c of cs){chars[c.uuid]=c;log('  '+short(c.uuid)+' read='+c.properties.read+' notify='+c.properties.notify+' write='+c.properties.write)}}catch(e){log('  getCharacteristics FEHLER '+err(e))}}const targets=[['OP_STATUS',OP.replace('cd0-','cd2-')],['OP_ODO',OP.replace('cd0-','cd3-')],['SET_STATUS',SET.replace('7e0-','7e2-')],['BAT_LEVEL',BAT.replace('8c10-','8c11-')],['BAT_DIAG',BAT.replace('8c10-','8c14-')],['DIAG_STATUS',DIA.replace('9d90-','9d92-')]];for(const [name,uuid] of targets){const c=chars[uuid];if(!c){log(name+' FEHLT in Bluefy-GATT');continue}log(name+' vorhanden');if(c.properties.notify){try{c.addEventListener('characteristicvaluechanged',ev=>log(name+' NOTIFY '+hex(ev.target.value)));await c.startNotifications();log(name+' notify OK')}catch(e){log(name+' notify FEHLER '+err(e))}}if(c.properties.read){try{const v=await c.readValue();log(name+' READ '+hex(v))}catch(e){log(name+' read FEHLER '+err(e))}}}log('Fertig. 15 Sekunden warten, dann Protokoll kopieren.')}catch(e){log('TEST FEHLER '+err(e));status.textContent='Fehler'}finally{document.querySelector('#connect').disabled=false}}document.querySelector('#connect').onclick=test;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));status.textContent='Protokoll kopiert'}catch(e){status.textContent='Kopieren nicht möglich: Text im Protokoll markieren'}};
</script></body></html>
