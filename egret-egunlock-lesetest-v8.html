<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egret X – eg-unlock Lesetest v8</title><style>body{background:#101924;color:#e8f0f6;font:16px system-ui;margin:0;padding:22px}h1{font-size:25px}button{background:#52ceb7;border:0;border-radius:12px;padding:14px;margin:4px 4px 12px 0;font-weight:700;font-size:15px}section{background:#223342;border-radius:14px;padding:16px;margin:12px 0}strong{font-size:23px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.55}small{color:#b6c9d5}</style></head><body><h1>Egret X · eg-unlock Lesetest v8</h1><p>Separater Lesetest auf Basis der UUIDs und Auswertungslogik von eg-unlock v22. <b>Keine Schreib- oder Steuerbefehle.</b></p><button id="connect">Scooter verbinden</button><button id="disconnect">Trennen</button><button id="copy">Diagnose kopieren</button><section>Verbindung: <strong id="state">Nicht verbunden</strong></section><section>Akku: <strong id="battery">–</strong></section><section>Geschwindigkeit: <strong id="speed">–</strong></section><section>Modus: <strong id="mode">–</strong></section><section>Kilometerstand: <strong id="odo">–</strong></section><section><b>Diagnoseprotokoll</b><pre id="log"></pre></section><script>
'use strict';
const U={OP_STAT:'7d971cd2-8ebd-4684-b771-b2362b7e922a',OP_ODO:'7d971cd3-8ebd-4684-b771-b2362b7e922a',BAT_LVL:'f4b68c11-9e9e-4b97-a9c9-272e32453252',BAT_DIAG:'f4b68c14-9e9e-4b97-a9c9-272e32453252',DIA_STAT:'2b419d92-adef-4ca3-8652-c02093b6c84e',SET_STAT:'bccae7e2-458d-4554-8d8a-ddadd926efe3'};
const svcs=['7d971cd0-8ebd-4684-b771-b2362b7e922a','bccae7e0-458d-4554-8d8a-ddadd926efe3','2b419d90-adef-4ca3-8652-c02093b6c84e','f4b68c10-9e9e-4b97-a9c9-272e32453252','70d1b670-eba5-4d76-868f-6d1b66108fdc','0000180a-0000-1000-8000-00805f9b34fb'];
const $=x=>document.getElementById(x), logs=[];let device=null,cs={};
function log(s){let l='['+new Date().toLocaleTimeString('de-DE',{hour12:false})+'] '+s;logs.push(l);$('log').textContent=logs.join('\n');}
function hx(a){return Array.from(a,x=>x.toString(16).padStart(2,'0')).join(' ')}
function val(view){return Array.from(new Uint8Array(view.buffer,view.byteOffset,view.byteLength))}
const modes=['Off/6','Eco','Tour','Sport','Pedestrian','DMode','SMode','XMode','Neutral'];
function parse(name,b){if(name==='BAT_LVL'&&b.length)$('battery').textContent=b[0]+' %';if(name==='OP_STAT'&&b.length>=14){$('speed').textContent=(((b[1]<<8)|b[2])/10).toFixed(1)+' km/h';$('mode').textContent=modes[b[12]]||'Modus '+b[12]}if(name==='OP_ODO'&&b.length>=5){let total=(b[2]<<16)|(b[3]<<8)|b[4];$('odo').textContent=total.toLocaleString('de-DE')+' km'}}
async function channel(name){const c=cs[U[name]];if(!c){log(name+': nicht gefunden');return}log(name+': Eigenschaften read='+c.properties.read+' notify='+c.properties.notify);if(c.properties.notify||c.properties.indicate){try{c.addEventListener('characteristicvaluechanged',e=>{let b=val(e.target.value);log(name+': Nachricht '+hx(b));parse(name,b)});log(name+': startNotifications START');await c.startNotifications();log(name+': startNotifications OK')}catch(e){log(name+': startNotifications FEHLER '+e.message)}}if(c.properties.read){try{log(name+': readValue START');let b=val(await c.readValue());log(name+': readValue OK '+hx(b));parse(name,b)}catch(e){log(name+': readValue FEHLER '+e.message)}}}
$('connect').onclick=async()=>{try{logs.length=0;$('log').textContent='';$('state').textContent='Verbinde…';log('eg-unlock Lesetest v8; Bluefy '+navigator.userAgent);device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EGRET'},{namePrefix:'Egret'}],optionalServices:svcs});device.addEventListener('gattserverdisconnected',()=>{$('state').textContent='Getrennt';log('Verbindung getrennt')});let server=await device.gatt.connect();$('state').textContent='Verbunden';log('GATT verbunden');cs={};for(let s of await server.getPrimaryServices()){try{for(let c of await s.getCharacteristics())cs[c.uuid.toLowerCase()]=c}catch(e){log('Service '+s.uuid+' Fehler '+e.message)}}log('Eigenschaften gefunden: '+Object.keys(cs).length);for(let name of ['OP_STAT','BAT_LVL','DIA_STAT','OP_ODO','SET_STAT','BAT_DIAG'])await channel(name);log('Lesetest abgeschlossen; keine Schreibbefehle gesendet')}catch(e){log('FEHLER: '+e.message);$('state').textContent='Fehler'}};
$('disconnect').onclick=()=>{if(device&&device.gatt.connected)device.gatt.disconnect()};$('copy').onclick=async()=>{let txt='Egret X eg-unlock Lesetest v8\n'+logs.join('\n');try{await navigator.clipboard.writeText(txt);log('Diagnose kopiert')}catch(e){let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();log('Diagnose kopiert (Fallback)')}};
log('Bereit – nur lesender Test');
</script></body></html>
