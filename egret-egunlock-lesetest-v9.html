<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egret X – Lesetest v9</title><style>body{font:16px system-ui;background:#101924;color:#ecf3fa;margin:0;padding:18px}h1{font-size:24px}button{background:#5dd6bd;color:#0d2026;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin:4px 4px 8px 0}section{background:#233443;padding:14px;border-radius:12px;margin:12px 0}strong{font-size:21px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5}small{color:#b7c9d4}</style></head><body><h1>Egret X · Lesetest v9</h1><p>Bluetooth-Kanäle erkennen, lesend prüfen und Diagnosen protokollieren. <b>Keine Schreibbefehle.</b></p><button id="connect">Scooter verbinden</button><button id="disconnect">Trennen</button><button id="copy">Diagnose kopieren</button><section>Verbindung: <strong id="state">Nicht verbunden</strong></section><section>Akku: <strong id="battery">–</strong></section><section>Geschwindigkeit: <strong id="speed">–</strong></section><section>Modus: <strong id="mode">–</strong></section><section>Kilometerstand: <strong id="odo">–</strong></section><section>Diagnoseprotokoll<pre id="log"></pre></section><script>
'use strict';
const U={OP_STAT:'7d971cd2-8ebd-4684-b771-b2362b7e922a',OP_ODO:'7d971cd3-8ebd-4684-b771-b2362b7e922a',BAT_LVL:'f4b68c11-9e9e-4b97-a9c9-272e32453252',BAT_DIAG:'f4b68c14-9e9e-4b97-a9c9-272e32453252',DIA_STAT:'2b419d92-adef-4ca3-8652-c02093b6c84e',SET_STAT:'bccae7e2-458d-4554-8d8a-ddadd926efe3'};
const S=['7d971cd0-8ebd-4684-b771-b2362b7e922a','bccae7e0-458d-4554-8d8a-ddadd926efe3','2b419d90-adef-4ca3-8652-c02093b6c84e','f4b68c10-9e9e-4b97-a9c9-272e32453252','70d1b670-eba5-4d76-868f-6d1b66108fdc','0000180a-0000-1000-8000-00805f9b34fb'];
const $=id=>document.getElementById(id);let logs=[],device=null,chars=new Map(),busy=false;
function log(s){logs.push('['+new Date().toLocaleTimeString('de-DE',{hour12:false})+'] '+s);$('log').textContent=logs.join('\n')}
function hex(b){return b.map(v=>v.toString(16).padStart(2,'0')).join(' ')}
function bytes(v){return Array.from(new Uint8Array(v.buffer,v.byteOffset,v.byteLength))}
const modes=['Off/6','Eco','Tour','Sport','Pedestrian','DMode','SMode','XMode','Neutral'];
function parse(n,b){if(n==='BAT_LVL'&&b.length)$('battery').textContent=b[0]+' %';if(n==='OP_STAT'&&b.length>=14){$('speed').textContent=(((b[1]<<8)|b[2])/10).toFixed(1)+' km/h';$('mode').textContent=modes[b[12]]||'Modus '+b[12]}if(n==='OP_ODO'&&b.length>=5)$('odo').textContent=((b[2]<<16)|(b[3]<<8)|b[4]).toLocaleString('de-DE')+' km'}
async function test(n){let c=chars.get(U[n].toLowerCase());if(!c){log(n+': NICHT GEFUNDEN (gesucht '+U[n]+')');return}log(n+': gefunden; read='+!!c.properties.read+' notify='+!!c.properties.notify+' indicate='+!!c.properties.indicate);if(c.properties.notify||c.properties.indicate){try{c.addEventListener('characteristicvaluechanged',e=>{let b=bytes(e.target.value);log(n+' NOTIFY '+hex(b));parse(n,b)});log(n+' notify START');await c.startNotifications();log(n+' notify OK')}catch(e){log(n+' notify FEHLER '+e.message)}}if(c.properties.read){try{log(n+' read START');let b=bytes(await c.readValue());log(n+' read OK '+hex(b));parse(n,b)}catch(e){log(n+' read FEHLER '+e.message)}}}
$('connect').onclick=async()=>{if(busy)return;busy=true;try{logs=[];$('log').textContent='';for(let id of ['battery','speed','mode','odo'])$(id).textContent='–';$('state').textContent='Verbinde…';log('Lesetest v9 / '+navigator.userAgent);if(!navigator.bluetooth)throw Error('Web Bluetooth nicht verfügbar: bitte Bluefy verwenden');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EGRET'},{namePrefix:'Egret'}],optionalServices:S});device.addEventListener('gattserverdisconnected',()=>{$('state').textContent='Getrennt';log('Bluetooth getrennt')});let server=await device.gatt.connect();$('state').textContent='Verbunden';log('GATT verbunden');chars=new Map();let services=await server.getPrimaryServices();log('Services gefunden: '+services.length);for(let s of services){log('SERVICE '+s.uuid);try{let cc=await s.getCharacteristics();for(let c of cc){let key=String(c.uuid).toLowerCase();chars.set(key,c);log('  UUID '+key+' read='+!!c.properties.read+' notify='+!!c.properties.notify+' indicate='+!!c.properties.indicate)}}catch(e){log('  SERVICE FEHLER '+e.message)}}log('Eigenschaften gefunden: '+chars.size);for(let n of ['OP_STAT','BAT_LVL','DIA_STAT','OP_ODO','SET_STAT','BAT_DIAG'])await test(n);log('Test abgeschlossen – KEINE Schreibbefehle gesendet')}catch(e){log('FEHLER '+e.name+': '+e.message);$('state').textContent='Fehler'}finally{busy=false}};
$('disconnect').onclick=()=>{if(device&&device.gatt.connected)device.gatt.disconnect()};
$('copy').onclick=async()=>{let t='Egret X Lesetest v9\n'+logs.join('\n');try{await navigator.clipboard.writeText(t);log('Diagnose kopiert')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();log('Diagnose kopiert (Fallback)')}};
log('Bereit – v9, ausschließlich lesend');
</script></body></html>
