<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egret X · Startablauf-Test v6</title><style>body{font:16px system-ui;background:#0d1722;color:#eaf1f7;margin:0;padding:22px}button{background:#51cdb3;color:#082c2c;border:0;border-radius:12px;padding:15px;margin:5px 5px 12px 0;font-weight:700;font-size:16px}button:disabled{opacity:.4}.box{background:#203241;border-radius:14px;padding:17px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6}h1{font-size:26px}</style><h1>Egret X · Startablauf-Test v6</h1><p>Nur lesen: keine Schreib- oder Steuerbefehle. Prüft die Startreihenfolge: Benachrichtigungen aktivieren, anschließend Werte lesen. Jeder Schritt wird protokolliert. Keine Schreibbefehle.</p><button id="connect">Scooter verbinden</button><button id="disconnect" disabled>Trennen</button><button id="copy">Diagnose kopieren</button><div class="box">Verbindung: <b id="state">Nicht verbunden</b></div><div class="box"><b>Kanäle</b><div id="channels">Noch keine Daten</div></div><div class="box"><b>Protokoll</b><pre id="log"></pre></div><script>
'use strict';
const $=id=>document.getElementById(id);

let dev=null;let aborted=false;const counts=new Map();

$('connect').onclick=async()=>{aborted=false;$('connect').disabled=true;try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'EGRET'},{namePrefix:'Egret'},{services:[U.id]},{services:[U.op]}],optionalServices:[U.op,U.battery,U.diag,U.settings,U.id]});dev.addEventListener('gattserverdisconnected',()=>{aborted=true;$('state').textContent='Getrennt';$('disconnect').disabled=true;$('connect').disabled=false;log('Verbindung getrennt')});log('GATT: Verbindungsaufbau START');const server=await dev.gatt.connect();$('state').textContent='Verbunden';$('disconnect').disabled=false;log('GATT: verbunden');const map=new Map();for(const s of await server.getPrimaryServices()){log('Service '+s.uuid+' gefunden');for(const c of await s.getCharacteristics())map.set(c.uuid.toLowerCase(),c)}log('Eigenschaften gefunden: '+map.size);for(const [uuid,name] of targets){if(aborted)break;const c=map.get(uuid);if(!c){log(name+': fehlt');continue}log(name+': startNotifications START (notify='+!!c.properties.notify+', indicate='+!!c.properties.indicate+')');if(!c.properties.notify&&!c.properties.indicate){log(name+': nicht abonnierbar');continue}c.addEventListener('characteristicvaluechanged',e=>{const n=(counts.get(name)||0)+1;counts.set(name,n);$('channels').textContent=[...counts].map(([k,v])=>k+': '+v+' Meldungen').join(' · ');if(n<=2)log(name+': Nachricht '+n+' = '+hex(e.target.value))});let timer;const outcome=await Promise.race([c.startNotifications().then(()=>({ok:true}),e=>({error:String(e)})),new Promise(r=>{timer=setTimeout(()=>r({timeout:true}),7000)})]);clearTimeout(timer);if(outcome.timeout){log(name+': TIMEOUT nach 7 Sekunden; Test angehalten (kein weiterer Bluetooth-Aufruf)');break}if(outcome.error){log(name+': FEHLER '+outcome.error);continue}log(name+': startNotifications OK');if(c.properties.read){log(name+': readValue START');let readTimer;const readResult=await Promise.race([c.readValue().then(v=>({value:v}),e=>({error:String(e)})),new Promise(r=>{readTimer=setTimeout(()=>r({timeout:true}),7000)})]);clearTimeout(readTimer);if(readResult.timeout){log(name+': readValue TIMEOUT nach 7 Sekunden; Test angehalten');break}if(readResult.error){log(name+': readValue FEHLER '+readResult.error)}else{log(name+': readValue OK = '+hex(readResult.value))}}else{log(name+': nicht lesbar')} }
log('Startablauf abgeschlossen; keine Schreibbefehle gesendet');}catch(e){log('FEHLER '+String(e));$('connect').disabled=false}};
